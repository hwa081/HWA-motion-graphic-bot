<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HWA Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23fff'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='%23000'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/studio.css">
</head>
<body>
<div id="app" class="app">

  <!-- ============ sidebar ============ -->
  <aside id="side" class="side">
    <div class="side-top">
      <button class="icon-btn" id="btnHome" title="Home" aria-label="Home"><svg class="i" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg></button>
      <div class="proj" id="projName">New project</div>
      <button class="icon-btn" id="btnProjMenu" title="More" aria-label="More"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="media" data-filter="all"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span>All media</span></button>
      <button class="nav-item" data-view="media" data-filter="image"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M6 17l4-5 3 3 2-2 3 4"/></svg><span>Images</span></button>
      <button class="nav-item" data-view="media" data-filter="video"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M17 10l4-2v8l-4-2z"/></svg><span>Videos</span></button>
      <button class="nav-item" data-view="media" data-filter="scene"><svg class="i" viewBox="0 0 24 24"><path d="M4 8h16v11H4zM4 8l2-4h4l-2 4M10 8l2-4h4l-2 4"/></svg><span>Scenes</span></button>
      <hr>
      <button class="nav-item" data-view="library"><svg class="i" viewBox="0 0 24 24"><path d="M3 6h7l2 2h9v11H3z"/></svg><span>Library</span></button>
      <hr>
      <button class="nav-item" data-view="tools"><svg class="i" viewBox="0 0 24 24"><circle cx="5" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="19" cy="6" r="1.6"/><circle cx="5" cy="13" r="1.6"/><circle cx="12" cy="13" r="1.6"/><circle cx="19" cy="13" r="1.6"/><circle cx="5" cy="20" r="1.6"/><circle cx="12" cy="20" r="1.6"/></svg><span>Tools</span></button>
      <button class="nav-item" data-view="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg><span>Settings</span></button>
    </nav>
    <div class="side-bottom">
      <button class="nav-item" data-view="media" data-filter="trash"><svg class="i" viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/></svg><span>Trash</span></button>
      <button class="nav-item" id="btnCollapse"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M16 9l-3 3 3 3"/></svg><span>Collapse</span></button>
    </div>
  </aside>

  <!-- ============ main ============ -->
  <main class="main">
    <header class="top">
      <div class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M16 16l5 5"/></svg><input id="search" placeholder="Search prompts, styles, ideas" autocomplete="off"></div>
      <button class="icon-btn round" id="btnFilter" title="Filter"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M7 12h10M10 17h4"/></svg></button>
      <div class="top-right">
        <button class="icon-btn" id="btnRefresh" title="Refresh"><svg class="i" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg></button>
        <button class="icon-btn" id="btnHelp" title="Help"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.5"/></svg></button>
        <button class="icon-btn" data-view="settings" title="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></button>
        <div class="pill" id="connPill"><span class="dot" id="connDot"></span><span id="connText">Not connected</span><span class="avatar" id="avatar">H</span></div>
      </div>
    </header>

    <!-- media grid -->
    <section id="view-media" class="view show">
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty" hidden>
        <div class="empty-title">Nothing here yet</div>
        <div class="empty-sub" id="emptySub">Open <b>Settings</b> to connect GitHub, then type what you want to create below.</div>
      </div>
    </section>

    <!-- library -->
    <section id="view-library" class="view">
      <div class="page"><h1>Library</h1>
        <div class="tabs" id="libTabs"><button class="tab active" data-lib="designs">Designs</button><button class="tab" data-lib="techniques">Techniques</button><button class="tab" data-lib="lessons">Lessons</button><button class="tab" data-lib="wishes">Wishlist</button></div>
        <div id="libBody" class="cards"></div>
      </div>
    </section>

    <!-- tools -->
    <section id="view-tools" class="view">
      <div class="page"><h1>Tools</h1>
        <div class="cards" id="toolCards"></div>
      </div>
    </section>

    <!-- settings -->
    <section id="view-settings" class="view">
      <div class="page narrow"><h1>Settings</h1>
        <div id="settingsBody"></div>
      </div>
    </section>

    <!-- ============ prompt bar ============ -->
    <div class="composer-wrap" id="composerWrap">
      <div class="popup" id="popup" hidden>
        <div class="seg two" id="segMode"><button data-mode="ai" class="on"><svg class="i" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg>AI plan</button><button data-mode="code"><svg class="i" viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg>Code Studio</button></div>
        <div class="seg two" id="segInput"><button data-input="ingredients" class="on"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M6 17l4-5 3 3 2-2 3 4"/></svg>Ingredients</button><button data-input="reference"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="12" rx="2"/><path d="M17 10l4-2v8l-4-2z"/></svg>Reference</button></div>
        <div class="seg two" id="segSize"><button data-size="16:9" class="on"><span class="ar a169"></span>16:9</button><button data-size="9:16"><span class="ar a916"></span>9:16</button></div>
        <div class="seg one" id="segSize2"><button data-size="1:1"><span class="ar a11"></span>1:1 square</button></div>
        <label class="select"><select id="selModel"></select></label>
        <div class="seg four" id="segDur"><button data-dur="4">4s</button><button data-dur="6">6s</button><button data-dur="8" class="on">8s</button><button data-dur="10">10s</button></div>
        <div class="seg four" id="segCount"><button data-n="1" class="on">x1</button><button data-n="2">x2</button><button data-n="3">x3</button><button data-n="4">x4</button></div>
        <div class="opts">
          <label class="chk"><input type="checkbox" id="optReview" checked> AI review</label>
          <label class="chk"><input type="checkbox" id="optSound" checked> Sound</label>
          <label class="dur">Custom <input type="number" id="durCustom" min="3" max="60" placeholder="3-60"> s</label>
        </div>
        <div class="cost" id="cost">Generating will use about 6 AI requests</div>
      </div>

      <div class="composer" id="composer">
        <div class="attach-row" id="attachRow" hidden></div>
        <textarea id="prompt" rows="1" placeholder="What do you want to create?"></textarea>
        <div class="composer-bar">
          <button class="round-btn" id="btnAttach" title="Add images or a reference video"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
          <input type="file" id="fileIn" accept="image/*,video/mp4,video/webm,video/quicktime" multiple hidden>
          <button class="chip" id="chipAgent">Agent</button>
          <span class="grow"></span>
          <button class="chip" id="chipSummary">Video · 16:9 · 8s · x1</button>
          <button class="round-btn send" id="btnSend" title="Create"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
      </div>
      <div class="footnote">The AI can make mistakes, so double-check the result.</div>
    </div>
  </main>
</div>

<!-- viewer -->
<div class="modal" id="viewer" hidden>
  <div class="modal-card">
    <button class="icon-btn modal-x" id="vClose" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="v-media" id="vMedia"></div>
    <div class="v-side">
      <div class="v-title" id="vTitle"></div>
      <div class="v-meta" id="vMeta"></div>
      <div class="v-actions" id="vActions"></div>
      <div class="v-rate"><span>Rate it so the bot learns</span><div id="vStars"></div><input id="vNote" placeholder="What did you like / dislike?"><button class="btn" id="vSendFb">Send feedback</button></div>
      <details class="v-report"><summary>Report</summary><pre id="vReport">…</pre></details>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="vendor/nacl-fast.min.js"></script>
<script src="js/crypto.js"></script>
<script src="js/app.js"></script>
<script src="js/gh.js"></script>
<script src="js/settings.js"></script>
<script src="js/jobs.js"></script>
<script src="js/library.js"></script>
</body>
</html>
